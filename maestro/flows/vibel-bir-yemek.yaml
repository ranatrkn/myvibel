appId: com.myvibel.app
---
- back
- tapOn: "Alt menü Yeni gönderi"
- tapOn: "Gönderi metni"
- eraseText: 80
- inputText: "Vibel yemek vil"
- hideKeyboard
- tapOn: "Paylaş"
- extendedWaitUntil:
    visible: "Takip Edilen|Gönderi paylaşıldı."
    timeout: 20000
- tapOn: "Alt menü Profil"
- scrollUntilVisible:
    element: "Vibel odası"
    direction: DOWN
    timeout: 15000
- tapOn: "Vibel odası"
- tapOn: "Yemek \\(15 vil\\)"
- tapOn:
    text: "Tekrar gösterme"
    optional: true
- tapOn:
    text: "Tamam"
    optional: true
- extendedWaitUntil:
    visible: "Lezzetli.*|Seviye.*"
    timeout: 15000
