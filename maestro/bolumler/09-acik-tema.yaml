appId: com.myvibel.app
---
- runFlow: ../flows/ana-sayfaya-don.yaml
- tapOn: "Alt menü Profil"
- extendedWaitUntil:
    visible: "Beğendiklerim"
    timeout: 25000
- scrollUntilVisible:
    element: "Ayarlar"
    direction: UP
    optional: true
- tapOn: "Ayarlar"
- extendedWaitUntil:
    visible: "Gizli Hesap.*"
    timeout: 15000
- tapOn: "Açık"
- back
- tapOn: "Alt menü Ana"
- extendedWaitUntil:
    visible: "Takip Edilen"
    timeout: 20000
- tapOn:
    text: "Akış"
    optional: true
- tapOn: "Alt menü Yeni gönderi"
- runFlow: ../flows/yeni-gonderi-hazir.yaml
- tapOn: "Gönderi metni"
- inputText: "MaestroQA audit acik"
- hideKeyboard
- tapOn: "Paylaş|Alıntıyı paylaş"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Alt menü Ana"
- tapOn:
    text: "Gönderiyi beğen"
    index: 0
    optional: true
- tapOn:
    text: "Yorumları aç"
    index: 0
    optional: true
- runFlow:
    when:
      visible: "Yorumlar.*"
    commands:
      - tapOn: "Yorum yaz..."
      - inputText: "MaestroQA yorum acik"
      - hideKeyboard
      - tapOn: "Yorum gönder"
      - back
- tapOn: "Mesajlar"
- waitForAnimationToEnd:
    timeout: 3000
- back
- tapOn: "Alt menü Keşfet"
- extendedWaitUntil:
    visible: "Liderlik"
    timeout: 25000
- tapOn: "Alt menü Bildirimler"
- extendedWaitUntil:
    visible: "Bildirimler"
    timeout: 20000
- tapOn: "Alt menü Profil"
- extendedWaitUntil:
    visible: "Beğendiklerim"
    timeout: 25000
- scrollUntilVisible:
    element: "Vibel odası"
    direction: DOWN
    optional: true
- runFlow:
    when:
      visible: "Vibel odası"
    commands:
      - tapOn: "Vibel odası"
      - waitForAnimationToEnd:
          timeout: 2000
      - back
- scrollUntilVisible:
    element: "Ayarlar"
    direction: UP
    optional: true
- tapOn: "Ayarlar"
- extendedWaitUntil:
    visible: "Gizli Hesap.*"
    timeout: 15000
- tapOn: "Kullanım Koşulları"
- back
- tapOn: "Ayarlar"
- tapOn: "Gizlilik Politikası"
- back
- tapOn: "Ayarlar"
- tapOn: "Yardım / SSS"
- back
- tapOn: "Ayarlar"
- runFlow:
    when:
      visible: "Sürüm Notları"
    commands:
      - tapOn: "Sürüm Notları"
      - back
      - tapOn:
          text: "Ayarlar"
          optional: true
- tapOn: "Destek ve Geri Bildirim"
- back
- tapOn: "Ayarlar"
- tapOn: "Koyu"
- back
- tapOn: "Alt menü Ana"
- assertVisible: "Takip Edilen"
