appId: com.myvibel.app
---
- runFlow: ../flows/ana-sayfaya-don.yaml
- tapOn:
    text: "Gönderiyi beğen"
    index: 0
    optional: true
- tapOn:
    text: "Vazgeç"
    optional: true
- tapOn:
    text: "Yorumları aç"
    index: 0
    optional: true
- runFlow:
    when:
      visible: "Yorumlar.*"
    commands:
      - tapOn: "Yorum yaz..."
      - inputText: "MaestroQA yorum koyu"
      - hideKeyboard
      - tapOn: "Yorum gönder"
      - waitForAnimationToEnd:
          timeout: 4000
      - tapOn:
          text: "Yorumu yanıtla"
          index: 0
          optional: true
      - runFlow:
          when:
            visible: "Yanıt yaz.*|Yorum yaz.*"
          commands:
            - tapOn:
                text: "Yanıt yaz.*|Yorum yaz..."
                optional: true
            - inputText: "MaestroQA yanit"
            - hideKeyboard
            - tapOn:
                text: "Yorum gönder"
                optional: true
      - back
- tapOn:
    text: "Gönderiyi alıntıla"
    index: 0
    optional: true
- runFlow:
    when:
      visible: "Alıntılı Gönderi|Alıntıyı paylaş"
    commands:
      - tapOn:
          text: "Alıntıyı kaldır"
          optional: true
      - tapOn: "Alt menü Ana"
- tapOn:
    text: "Gönderiyi ilet"
    index: 0
    optional: true
- runFlow:
    when:
      visible: "İlet.*|Gönderiyi İlet.*"
    commands:
      - back
