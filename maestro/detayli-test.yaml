appId: com.myvibel.app
---
# En detaylı uçtan uca tuş taraması.
# Hesap A: oturum açık (ranatrkn). Hesap B: tttt / ttt / sss / rana — Keşfet üzerinden.
# Çıkış Yap oturumu kilitler (şifre yok). Hesap silme ONAYI yok. Şifre sıfırlama maili yok.
# Gizli Hesap anahtarı değiştirilmez.
- runFlow: flows/launch.yaml
- tapOn:
    text: "Tamam"
    optional: true
- runFlow: flows/ana-sayfaya-don.yaml

# ---------- ANA: sekmeler, maskot, mesajlar, gonderi ----------
- assertVisible: "Takip Edilen"
- tapOn:
    text: "Akış"
    optional: true
- tapOn:
    text: "Takip Edilen"
    optional: true
- tapOn:
    text: "Akış"
    optional: true
- tapOn:
    text: "Takip Edilen"
    optional: true

# Maskot karti (Lottie tam ekran)
- tapOn:
    point: "143,348"
    optional: true
- runFlow:
    when:
      visible: "Kapat|Tam ekran.*"
    commands:
      - back
- runFlow:
    when:
      visible: "Uyandır|Yemek \\(.*|Uyu \\(.*"
    commands:
      - tapOn:
          text: "Uyandır"
          optional: true
      - tapOn:
          text: "Yemek \\(.*"
          optional: true
      - tapOn:
          text: "Tekrar gösterme"
          optional: true
      - tapOn:
          text: "Kapat"
          optional: true
      - tapOn:
          text: "Uyu \\(.*"
          optional: true
      - tapOn:
          text: "Vibel rengi.*"
          optional: true
      - back
- runFlow: flows/ana-sayfaya-don.yaml

# Mesajlar — iki hesap sohbetleri
- tapOn: "Mesajlar"
- extendedWaitUntil:
    visible: "Sohbetlerde ara.*"
    timeout: 20000
- tapOn:
    text: "Sohbetlerde ara.*"
    optional: true
- hideKeyboard
- tapOn: "Yeni sohbet"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Yeni Sohbet.*"
    commands:
      - tapOn:
          text: "Kullanıcı ara.*"
          optional: true
      - hideKeyboard
      - back
- tapOn:
    text: "rana"
    optional: true
- tapOn:
    text: "tttt"
    optional: true
- tapOn:
    text: "ttt"
    optional: true
- runFlow:
    when:
      visible: "Mesaj yaz.*"
    commands:
      - tapOn:
          text: "Sessize al.*"
          optional: true
      - tapOn:
          text: "Sessize almayı kaldır"
          optional: true
      - tapOn:
          text: "Mesaj yaz.*"
          optional: true
      - hideKeyboard
      - back
- runFlow: flows/ana-sayfaya-don.yaml

# MaestroQA gonderi yoksa olustur (yorum/beğeni/yanıt için)
- runFlow:
    when:
      notVisible: ".*MaestroQA gonderi.*"
    commands:
      - tapOn: "Alt menü Yeni gönderi"
      - extendedWaitUntil:
          visible: "Paylaş"
          timeout: 20000
      - tapOn:
          text: "Gönderi metni"
          optional: true
      - inputText: "MaestroQA gonderi"
      - hideKeyboard
      - waitForAnimationToEnd:
          timeout: 4000
      - tapOn: "Paylaş"
      - waitForAnimationToEnd:
          timeout: 8000
      - runFlow:
          when:
            visible: "Paylaş"
          commands:
            - tapOn: "Paylaş"
      - extendedWaitUntil:
          visible: "Takip Edilen"
          timeout: 30000
- runFlow: flows/ana-sayfaya-don.yaml

# Gonderi aksiyonlari
- tapOn:
    text: "Gönderiyi beğen"
    index: 0
    optional: true
- tapOn:
    text: "Beğenenleri göster"
    index: 0
    optional: true
- runFlow:
    when:
      visible: "Beğenenler"
    commands:
      - tapOn:
          text: "Henüz beğeni yok."
          optional: true
      - back
- tapOn:
    text: "Yorumları aç"
    index: 0
    optional: true
- runFlow:
    when:
      visible: "Yorumlar.*"
    commands:
      - tapOn:
          text: "Yorum yaz.*"
          optional: true
      - inputText: "MaestroQA yorum"
      - hideKeyboard
      - tapOn:
          text: "Yorum gönder"
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          text: "Yorumu yanıtla"
          optional: true
      - tapOn:
          text: "Yanıtla"
          optional: true
      - tapOn:
          text: "Yorum yaz.*|@.* yanıtla.*"
          optional: true
      - inputText: "MaestroQA yanit"
      - hideKeyboard
      - tapOn:
          text: "Yorum gönder"
          optional: true
      - waitForAnimationToEnd:
          timeout: 5000
      - tapOn:
          text: "Yanıtları göster"
          optional: true
      - tapOn:
          text: ".*yanıtı gör"
          optional: true
      - tapOn:
          text: "Yanıtları gizle"
          optional: true
      - tapOn:
          text: "Yanıtları göster"
          optional: true
      - tapOn:
          text: "Yorumu sil"
          optional: true
      - tapOn:
          text: "Yorumu Sil"
          optional: true
      - tapOn:
          text: "Vazgeç"
          optional: true
      - back
- tapOn:
    text: "Gönderiyi alıntıla"
    index: 0
    optional: true
- runFlow:
    when:
      visible: "Alıntı.*"
    commands:
      - tapOn:
          text: "Alıntıyı kaldır"
          optional: true
      - back
- tapOn:
    text: "Gönderiyi ilet"
    index: 0
    optional: true
- runFlow:
    when:
      visible: "İlet.*"
    commands:
      - back

# Uc nokta menusu (ilk gonderi)
- tapOn:
    text: "Gönderi menüsü"
    index: 0
    optional: true
- tapOn:
    point: "939,713"
    optional: true
- runFlow:
    when:
      visible: "Alıntıla|Gönderiyi İlet"
    commands:
      - tapOn:
          text: "Alıntıla"
          optional: true
      - runFlow:
          when:
            visible: "Alıntı.*"
          commands:
            - tapOn:
                text: "Alıntıyı kaldır"
                optional: true
            - back
      - tapOn:
          text: "Gönderiyi İlet"
          optional: true
      - runFlow:
          when:
            visible: "İlet.*|Gönderiyi İlet.*"
          commands:
            - back
      - tapOn:
          text: "Gönderiyi Sil"
          optional: true
      - tapOn:
          text: "Vazgeç"
          optional: true
      - back

# ---------- KEŞFET ----------
- runFlow: flows/ana-sayfaya-don.yaml
- runFlow: flows/sekme-kesfet.yaml
- extendedWaitUntil:
    visible: "Liderlik"
    timeout: 25000
- tapOn:
    text: "Liderlik"
    optional: true
- runFlow:
    when:
      visible: "Seviye Liderliği.*"
    commands:
      - tapOn:
          text: "Vil"
          optional: true
      - tapOn:
          text: "Seviye"
          optional: true
      - back
- tapOn:
    text: "Takip Et"
    index: 0
    optional: true
- tapOn:
    text: "Takip Ediliyor"
    index: 0
    optional: true
- tapOn:
    text: "İstek Gönderildi"
    index: 0
    optional: true

# Hesap B ve diğer test kullanıcıları
- runFlow:
    file: flows/kullanici-profil-test.yaml
    env:
      HESAP: "tttt"
- runFlow: flows/sekme-kesfet.yaml
- runFlow:
    file: flows/kullanici-profil-test.yaml
    env:
      HESAP: "ttt"
- runFlow: flows/sekme-kesfet.yaml
- runFlow:
    file: flows/kullanici-profil-test.yaml
    env:
      HESAP: "rana"
- runFlow: flows/sekme-kesfet.yaml
- runFlow:
    file: flows/kullanici-profil-test.yaml
    env:
      HESAP: "sss"

# ---------- YENİ GÖNDERİ ----------
- runFlow: flows/ana-sayfaya-don.yaml
- runFlow: flows/sekme-yeni.yaml
- extendedWaitUntil:
    visible: "Paylaş"
    timeout: 20000
- tapOn: "Paylaş"
- tapOn:
    text: "Gönderi metni"
    optional: true
- hideKeyboard
- tapOn: "Paylaş"

# ---------- BİLDİRİM ----------
- runFlow: flows/ana-sayfaya-don.yaml
- runFlow: flows/sekme-bildirim.yaml
- extendedWaitUntil:
    visible: "Bildirimler"
    timeout: 20000
- tapOn:
    text: "Tümünü okundu işaretle"
    optional: true
- tapOn:
    text: "Gönderi"
    optional: true
- tapOn:
    text: "Gönderi"
    optional: true
- tapOn:
    text: "Takip"
    optional: true
- tapOn:
    text: "Takip"
    optional: true
- tapOn:
    text: "Bahsetmeler"
    optional: true
- tapOn:
    text: "Bahsetmeler"
    optional: true
- tapOn:
    text: "Temizle"
    optional: true
- tapOn:
    text: "İptal"
    optional: true
- tapOn:
    text: "Kabul Et"
    optional: true
- tapOn:
    text: "Reddet"
    optional: true

# ---------- PROFİL ----------
- runFlow: flows/ana-sayfaya-don.yaml
- runFlow: flows/sekme-profil.yaml
- extendedWaitUntil:
    visible: "Ayarlar"
    timeout: 25000
- scrollUntilVisible:
    element: "Beğendiklerim"
    direction: DOWN
    optional: true
- tapOn:
    text: "Beğendiklerim"
    optional: true
- tapOn:
    text: "Gönderilerim.*"
    optional: true
- tapOn:
    text: "Takipçi listesi"
    optional: true
- tapOn:
    text: "Takipçi"
    optional: true
- runFlow:
    when:
      visible: "Takipçi"
    commands:
      - tapOn:
          text: "Takip Edilen.*"
          optional: true
      - back
- tapOn:
    text: "Takip edilen listesi"
    optional: true
- tapOn:
    text: "Takip Edilen"
    optional: true
- runFlow:
    when:
      notVisible: "Beğendiklerim"
    commands:
      - back
- tapOn:
    text: "Liderlik tablosu"
    optional: true
- runFlow:
    when:
      visible: "Seviye Liderliği.*"
    commands:
      - back
- tapOn:
    text: "Profili düzenle"
    optional: true
- runFlow:
    when:
      visible: "Profili Düzenle.*"
    commands:
      - tapOn:
          text: "Vazgeç"
          optional: true
- tapOn:
    text: "Arkadaşlık bağları"
    optional: true
- runFlow:
    when:
      visible: "Arkadaşlık bağları"
    commands:
      - back
- tapOn:
    text: "Vibel odası"
    optional: true
- tapOn:
    text: "Maskot odasini ac"
    optional: true
- runFlow:
    when:
      visible: ".*odası|Uyandır|Yemek \\(.*"
    commands:
      - tapOn:
          text: "Uyandır"
          optional: true
      - tapOn:
          text: "Yemek \\(.*"
          optional: true
      - tapOn:
          text: "Tekrar gösterme"
          optional: true
      - tapOn:
          text: "Kapat"
          optional: true
      - tapOn:
          text: "Uyu \\(.*"
          optional: true
      - tapOn:
          text: "Vibel rengi.*"
          optional: true
      - back
- back
- tapOn:
    text: "Geri"
    optional: true

# ---------- AYARLAR ----------
- tapOn:
    text: "Alt menü Profil"
    optional: true
- tapOn:
    text: "Ayarlar"
    optional: true
- scrollUntilVisible:
    element: "Gizli Hesap.*"
    direction: DOWN
    optional: true
- tapOn:
    text: "Koyu"
    optional: true
- tapOn:
    text: "Açık"
    optional: true
- tapOn:
    text: "Koyu"
    optional: true
- scrollUntilVisible:
    element: "Vibel İsmini Değiştir|Engellenenler|Şifre Değiştir"
    direction: DOWN
    optional: true
- tapOn:
    text: "Vibel İsmini Değiştir"
    optional: true
- runFlow:
    when:
      visible: "Vibel İsmi.*"
    commands:
      - tapOn: "Vazgeç"
- tapOn:
    text: "Ayarlar"
    optional: true
- tapOn:
    text: "Moderasyon Paneli"
    optional: true
- runFlow:
    when:
      visible: "Moderasyon Paneli.*"
    commands:
      - tapOn:
          text: "Bekliyor"
          optional: true
      - tapOn:
          text: "İncelendi"
          optional: true
      - tapOn:
          text: "Reddedildi"
          optional: true
      - back
- tapOn:
    text: "Ayarlar"
    optional: true
- tapOn:
    text: "Destek Talepleri"
    optional: true
- runFlow:
    when:
      visible: "Destek Talepleri.*"
    commands:
      - back
- tapOn:
    text: "Ayarlar"
    optional: true
- tapOn:
    text: "Engellenenler"
    optional: true
- runFlow:
    when:
      visible: "Engellenen.*"
    commands:
      - back
- tapOn:
    text: "Ayarlar"
    optional: true
- runFlow:
    when:
      visible: "Şifre Değiştir"
    commands:
      - scrollUntilVisible:
          element: "Şifre Değiştir"
          direction: DOWN
          optional: true
      - tapOn:
          text: "Şifre Değiştir"
          optional: true
      - tapOn:
          text: "Vazgeç"
          optional: true
- runFlow: flows/reopen-settings.yaml
- scrollUntilVisible:
    element: "Kullanım Koşulları"
    direction: DOWN
    optional: true
- tapOn:
    text: "Kullanım Koşulları"
    optional: true
- back
- runFlow: flows/reopen-settings.yaml
- scrollUntilVisible:
    element: "Gizlilik Politikası"
    direction: DOWN
    optional: true
- tapOn:
    text: "Gizlilik Politikası"
    optional: true
- back
- runFlow: flows/reopen-settings.yaml
- scrollUntilVisible:
    element: "Yardım / SSS"
    direction: DOWN
    optional: true
- tapOn:
    text: "Yardım / SSS"
    optional: true
- tapOn:
    text: "Vibel nasıl gelişir?"
    optional: true
- tapOn:
    text: "Vil nedir?"
    optional: true
- tapOn:
    text: "Gizli hesap ne yapar?"
    optional: true
- back
- runFlow: flows/reopen-settings.yaml
- scrollUntilVisible:
    element: "Sürüm Notları"
    direction: DOWN
    optional: true
- runFlow:
    when:
      visible: "Sürüm Notları"
    commands:
      - tapOn: "Sürüm Notları"
      - back
      - tapOn:
          text: "Ayarlar"
          optional: true
- runFlow: flows/reopen-settings.yaml
- scrollUntilVisible:
    element: "Destek ve Geri Bildirim"
    direction: DOWN
    optional: true
- tapOn:
    text: "Destek ve Geri Bildirim"
    optional: true
- tapOn:
    text: "Talebi Gönder"
    optional: true
- back
- runFlow: flows/reopen-settings.yaml
- scrollUntilVisible:
    element: "Hesabı Sil"
    direction: DOWN
    optional: true
- tapOn:
    text: "Hesabı Sil"
    optional: true
- tapOn:
    text: "Vazgeç"
    optional: true

# Çıkış Yap tiklanmaz — ikinci hesaba şifresiz giriş yapılamaz

- runFlow: flows/ana-sayfaya-don.yaml
- tapOn:
    text: "Alt menü Ana"
    optional: true
- assertVisible: "Takip Edilen"
