  <meta charset="UTF-8">

  <meta http-equiv="Pragma" content="no-cache">

  <meta name="keywords" content="MyVibel, My Vibel, vibel karakteri, sosyal medya, Vibel">

  <meta property="og:site_name" content="MyVibel">
  <meta property="og:url" content="https://myvibel.com/app/">

  <meta property="og:description" content="Paylaş, Bağ kur, Vibel ile büyü.">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>MyVibel</title>

  <!-- Google Sign-In (web) -->
  <meta name="google-signin-client_id" content="808611716551-e9usr5incluue56upgtout3r2lbme2cs.apps.googleusercontent.com">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1A002E;
    }
    #yukleniyor {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: rgba(255,255,255,.85);
      font-family: system-ui, "Segoe UI", sans-serif;
      z-index: 9999;
      pointer-events: none;
      transition: opacity .15s ease;
    }
    #yukleniyor.gizli { opacity: 0; }
    #yukleniyor .nokta {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: #c62828;
      border-radius: 50%;
      animation: don 0.8s linear infinite;
    }
    @keyframes don { to { transform: rotate(360deg); } }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body style="margin:0;background:#1A002E;">
  <div id="yukleniyor" aria-live="polite">
    <div class="nokta" aria-hidden="true"></div>
    <div>MyVibel yükleniyor…</div>
  </div>
  <script>
    // Eski service worker / cache temizliği (eski web sürümü takılmasın)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].unregister();
        }
      });
      if (window.caches && caches.keys) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }
    }
  </script>
  <script>
    function yukleniyorGizle() {
      var el = document.getElementById('yukleniyor');
      if (!el) return;
      el.classList.add('gizli');
      setTimeout(function() { el.remove(); }, 200);
    }
    // Flutter kendi ilk karesini çizince HTML yükleyici kalkar; iki yükleyici üst üste binmez.
    window.addEventListener('flutter-first-frame', yukleniyorGizle, { once: true });
    window.addEventListener('load', function(ev) {
      // main.dart.js dosya adı sabit; query ile tarayıcı önbelleğini kır.
      // deploy-web.ps1 bu satırı sürüm klasöründeki kalıcı önbellekli kopyayla değiştirir.
      var entry = 'main.dart.js?v=' + encodeURIComponent(serviceWorkerVersion || String(Date.now()));
      // CanvasKit varsayılan olarak Google CDN'inden gelir (Hosting kotasından düşmez);
      // CDN'e ulaşılamazsa sayfa bir kez /app/canvaskit/ kopyasıyla yeniden açılır.
      var yerelMotor = /[?&]motor=yerel(&|$)/.test(location.search);
      var motorAyari = {
        renderer: 'canvaskit',
        // entrypoint query string asset yollarını bozmasın
        assetBase: '/app/',
      };
      if (yerelMotor) motorAyari.canvasKitBaseUrl = '/app/canvaskit/';
      _flutter.loader.loadEntrypoint({
        entrypointUrl: entry,
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine(motorAyari).then(function(appRunner) {
            appRunner.runApp();
            setTimeout(yukleniyorGizle, 10000);
          }).catch(function(err) {
            console.error('Flutter init failed', err);
            if (!yerelMotor) {
              var adres = new URL(location.href);
              adres.searchParams.set('motor', 'yerel');
              location.replace(adres.toString());
              return;
            }
            yukleniyorGizle();
            document.body.innerHTML =
              '<div style="color:#fff;font-family:system-ui;padding:24px;text-align:center">' +
              '<h2>MyVibel yüklenemedi</h2>' +
              '<p>Sayfayı yenile (Ctrl+F5). Sorun sürerse farklı tarayıcı dene.</p>' +
              '</div>';
          });
        }
      });
    });
  </script>
</body>
</html>
