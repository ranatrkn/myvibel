<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyVibel — Şifre Sıfırla</title>
  <link rel="stylesheet" href="/site-common.css">
  <link rel="icon" type="image/png" href="/app/favicon.png">
  <style>
    .wrap.reset-wrap { max-width: 420px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { color: var(--accent); font-size: 0.92rem; margin-top: 12px; }
    .success { color: #2e7d32; font-size: 0.95rem; }
    .hidden { display: none; }
    @media (min-width: 900px) {
      .wrap.reset-wrap { max-width: 480px; padding-top: 24px; }
    }
  </style>
</head>
<body>
  <header class="site-top">
    <a href="/">MyVibel</a>
    <div class="links">
      <a href="/app/">Giriş</a>
      <a href="/privacy.html">Gizlilik</a>
    </div>
  </header>
  <div class="wrap reset-wrap">
  <h1>MyVibel</h1>
  <p class="meta">Yeni şifreni belirle</p>

  <div id="formCard" class="card hidden">
    <p id="emailInfo" class="meta" style="margin-top:0"></p>
    <label for="password">Yeni şifre</label>
    <input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="En az 6 karakter">
    <label for="password2">Yeni şifre tekrar</label>
    <input id="password2" type="password" minlength="6" autocomplete="new-password" placeholder="Tekrar yaz">
    <button id="submitBtn" type="button">Şifreyi Kaydet</button>
    <p id="formError" class="error hidden"></p>
  </div>

  <div id="successCard" class="card hidden">
    <p class="success">Şifren güncellendi.</p>
    <p class="meta"><a href="https://myvibel.com/app/">MyVibel’e dönüp yeni şifrenle giriş yap</a></p>
  </div>

  <div id="errorCard" class="card hidden">
    <p id="errorText" class="error"></p>
    <p class="meta">Uygulamada «Şifremi unuttum» ile <strong>yeni bir mail</strong> iste. Eski maildeki bağlantı tek kullanımlıktır; Gmail/Outlook bazen linke otomatik tıklayıp kodu geçersiz kılabilir.</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: 'AIzaSyDoFKkkZA86Fo5Do9ICHrS-uEzT_wvtDE8',
      authDomain: 'myvibel-app.firebaseapp.com',
      projectId: 'myvibel-app',
      appId: '1:808611716551:web:05e410059a25cd8675cde2',
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const params = new URLSearchParams(window.location.search);
    const mode = params.get('mode');
    const oobCode = params.get('oobCode');

    const formCard = document.getElementById('formCard');
    const successCard = document.getElementById('successCard');
    const errorCard = document.getElementById('errorCard');
    const formError = document.getElementById('formError');
    const errorText = document.getElementById('errorText');
    const emailInfo = document.getElementById('emailInfo');
    const submitBtn = document.getElementById('submitBtn');

    function showError(message) {
      formCard.classList.add('hidden');
      successCard.classList.add('hidden');
      errorCard.classList.remove('hidden');
      errorText.textContent = message;
    }

    function hataMesaji(error) {
      switch (error.code) {
        case 'auth/expired-action-code':
          return 'Şifre sıfırlama bağlantısının süresi dolmuş.';
        case 'auth/invalid-action-code':
          return 'Şifre sıfırlama bağlantısı geçersiz veya daha önce kullanılmış.';
        case 'auth/weak-password':
          return 'Şifre çok zayıf. En az 6 karakter kullan.';
        default:
          return error.message || 'İşlem tamamlanamadı.';
      }
    }

    if (mode !== 'resetPassword' || !oobCode) {
      showError('Bağlantı eksik veya hatalı. Uygulamadan yeni sıfırlama maili iste.');
    } else {
      formCard.classList.remove('hidden');
      emailInfo.textContent = 'Yeni şifreni belirleyip kaydet.';
    }

    submitBtn.addEventListener('click', async () => {
      formError.classList.add('hidden');
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('password2').value;

      if (p1.length < 6) {
        formError.textContent = 'Şifre en az 6 karakter olmalı.';
        formError.classList.remove('hidden');
        return;
      }
      if (p1 !== p2) {
        formError.textContent = 'Şifreler eşleşmiyor.';
        formError.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      try {
        await auth.confirmPasswordReset(oobCode, p1);
        formCard.classList.add('hidden');
        successCard.classList.remove('hidden');
      } catch (error) {
        submitBtn.disabled = false;
        formError.textContent = hataMesaji(error);
        formError.classList.remove('hidden');
      }
    });
  </script>
  </div>
</body>
</html>
